name: 식단 자동 업데이트

# 구글 드라이브 폴더를 주기적으로 확인해, 새 식단 이미지가 있으면
# Claude(Sonnet)로 판독 → 주차 데이터 파일 생성 → OG 프리뷰 이미지 재생성 →
# main 에 자동 반영 → 배포 확인 → Slack 알림(버전 파라미터가 붙은 링크).

on:
  schedule:
    # 모두 한국시간(KST) 기준이며 cron 값은 UTC 로 적습니다 (KST = UTC+9).
    - cron: "0 2 * * 1" # 월 11:00 KST (월 02:00 UTC)
    - cron: "0 9 * * 4" # 목 18:00 KST (목 09:00 UTC)
  workflow_dispatch: {} # 수동 실행(테스트) 가능

permissions:
  contents: write

concurrency:
  group: menu-auto-update
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 동기화 스크립트 의존성 설치
        run: npm install --no-audit --no-fund
        working-directory: .github/scripts/menu-sync

      - name: 드라이브 확인 + 식단 판독
        id: sync
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: node .github/scripts/menu-sync/sync.mjs

      - name: 앱 의존성 설치
        if: steps.sync.outputs.changed == 'true'
        run: npm install --no-audit --no-fund

      # 새 주차의 프리뷰 이미지(public/og/<주차id>.png)와 manifest.json 을 만든다.
      # 이걸 안 돌리면 /api/og 가 "가장 최근 지난 주차"로 폴백해서, 캐시를 무효화해도
      # 프리뷰가 옛 주차 그림으로 남는다. (puppeteer/Chromium 필요)
      - name: OG 프리뷰 이미지 생성
        id: og
        if: steps.sync.outputs.changed == 'true'
        continue-on-error: true
        run: npm run og

      - name: 빌드 검증
        if: steps.sync.outputs.changed == 'true'
        run: npm run build

      - name: main 에 자동 반영(커밋·푸시)
        id: commit
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "menu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/menu-2026-*.js src/data/index.js .github/menu-sync/processed.json
          git add public/og public/og.png
          git commit -m "식단 자동 반영: ${{ steps.sync.outputs.label }} (${{ steps.sync.outputs.week_id }})"
          git pull --rebase origin main
          git push origin HEAD:main
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # og:image 에 붙는 리비전 = 배포 커밋 해시 앞 7자 (vite.config.js 와 동일 규칙)
          echo "og_rev=${sha:0:7}" >> "$GITHUB_OUTPUT"

      # 배포 전에 슬랙에 올리면 크롤러가 예전 og:image 를 캐시해 버린다.
      # 사이트가 이번 커밋으로 갱신될 때까지 기다린다(최대 8분, 실패해도 진행).
      - name: 배포 반영 대기
        if: steps.sync.outputs.changed == 'true'
        continue-on-error: true
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          OG_REV: ${{ steps.commit.outputs.og_rev }}
        run: node .github/scripts/menu-sync/wait-deploy.mjs

      - name: Slack 알림(관리자 + 공지)
        if: steps.sync.outputs.changed == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ADMIN: ${{ secrets.SLACK_CHANNEL_ADMIN }}
          SLACK_CHANNEL_NOTICE: ${{ secrets.SLACK_CHANNEL_NOTICE }}
          SITE_URL: ${{ secrets.SITE_URL }}
          MENU_LABEL: ${{ steps.sync.outputs.label }}
          MENU_RANGE: ${{ steps.sync.outputs.range }}
          MENU_SOURCE: ${{ steps.sync.outputs.source }}
          MENU_WEEK_ID: ${{ steps.sync.outputs.week_id }}
          OG_REV: ${{ steps.commit.outputs.og_rev }}
          OG_STATUS: ${{ steps.og.outcome }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.commit.outputs.sha }}
        run: node .github/scripts/menu-sync/notify.mjs
