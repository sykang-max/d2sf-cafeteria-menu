name: 식단 자동 업데이트

# 구글 드라이브 폴더를 주기적으로 확인해, 새 식단 이미지가 있으면
# Claude(Sonnet)로 판독 → 주차 데이터 파일 생성 → main 에 자동 반영 → Slack 알림.

on:
  schedule:
    # 모두 한국시간(KST) 기준이며 cron 값은 UTC 로 적습니다 (KST = UTC+9).
    - cron: "0 2 * * 1" # 월 11:00 KST (월 02:00 UTC)
    - cron: "0 9 * * 4" # 목 18:00 KST (목 09:00 UTC)
  workflow_dispatch: {} # 수동 실행(테스트) 가능

permissions:
  contents: write

concurrency:
  group: menu-auto-update
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 동기화 스크립트 의존성 설치
        run: npm install --no-audit --no-fund
        working-directory: .github/scripts/menu-sync

      - name: 드라이브 확인 + 식단 판독
        id: sync
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: node .github/scripts/menu-sync/sync.mjs

      - name: 앱 의존성 설치 + OG 이미지 생성 + 빌드 검증
        if: steps.sync.outputs.changed == 'true'
        run: |
          npm install --no-audit --no-fund
          npm run og || echo "⚠️ OG 생성 실패(Chromium 등) — 데이터만 반영합니다."
          npm run build

      - name: main 에 자동 반영(커밋·푸시)
        id: commit
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "menu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/menu-2026-*.js src/data/index.js .github/menu-sync/processed.json public/og public/og.png
          git commit -m "식단 자동 반영: ${{ steps.sync.outputs.label }} (${{ steps.sync.outputs.week_id }})"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Slack 알림(관리자 + 공지)
        if: steps.sync.outputs.changed == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ADMIN: ${{ secrets.SLACK_CHANNEL_ADMIN }}
          SLACK_CHANNEL_NOTICE: ${{ secrets.SLACK_CHANNEL_NOTICE }}
          SITE_URL: ${{ secrets.SITE_URL }}
          MENU_LABEL: ${{ steps.sync.outputs.label }}
          MENU_RANGE: ${{ steps.sync.outputs.range }}
          MENU_WEEK_ID: ${{ steps.sync.outputs.week_id }}
          MENU_SOURCE: ${{ steps.sync.outputs.source }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.commit.outputs.sha }}
        run: node .github/scripts/menu-sync/notify.mjs
